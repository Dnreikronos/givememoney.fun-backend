input {
  beats {
    port => 5044
  }
}

filter {
  # Drop health check noise
  if [path] == "/health" {
    drop {}
  }

  # Parse Zap RFC3339 timestamp into @timestamp
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # Convert latency from nanoseconds to milliseconds
  if [latency] {
    ruby {
      code => "event.set('latency_ms', event.get('latency').to_f / 1_000_000.0)"
    }
  }

  # Add status_class field for dashboard aggregation
  if [status] {
    ruby {
      code => "
        status = event.get('status').to_i
        if status >= 200 && status < 300
          event.set('status_class', '2xx')
        elsif status >= 300 && status < 400
          event.set('status_class', '3xx')
        elsif status >= 400 && status < 500
          event.set('status_class', '4xx')
        elsif status >= 500
          event.set('status_class', '5xx')
        end
      "
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "givememoney-logs-%{+YYYY.MM.dd}"
  }
}
